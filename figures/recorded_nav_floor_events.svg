<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Recorded CPDO NAV-floor event rates</title><desc id="desc">Previously recorded exploratory model results: base case 1.1 percent NAV-floor event, permanent plus 150 basis point shock at year three 99.8 percent, initial spread 200 basis points zero percent.</desc><rect width="1000" height="560" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172b4d">Recorded NAV-floor event rates</text><text x="500" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#52627a">Exploratory corrected prototype · 2,000 paths · seed 123</text><line x1="130" y1="440" x2="900" y2="440" stroke="#50627a" stroke-width="2"/><line x1="130" y1="140" x2="130" y2="440" stroke="#50627a" stroke-width="2"/><g font-family="Arial" font-size="14" fill="#52627a" text-anchor="end"><text x="116" y="445">0%</text><text x="116" y="370">25%</text><text x="116" y="295">50%</text><text x="116" y="220">75%</text><text x="116" y="145">100%</text></g><g stroke="#d9e1eb" stroke-width="1"><line x1="130" y1="365" x2="900" y2="365"/><line x1="130" y1="290" x2="900" y2="290"/><line x1="130" y1="215" x2="900" y2="215"/><line x1="130" y1="140" x2="900" y2="140"/></g><g fill="#3478c8"><rect x="220" y="436.7" width="120" height="3.3" rx="2"/><rect x="470" y="140.6" width="120" height="299.4" rx="3"/><rect x="720" y="440" width="120" height="0.5" rx="1"/></g><g font-family="Arial" font-size="18" font-weight="700" fill="#172b4d" text-anchor="middle"><text x="280" y="420">1.10%</text><text x="530" y="128">99.80%</text><text x="780" y="420">0.00%</text></g><g font-family="Arial" font-size="15" fill="#35465f" text-anchor="middle"><text x="280" y="468">Base case</text><text x="530" y="468">+150 bp shock</text><text x="530" y="490">at year 3</text><text x="780" y="468">Initial spread</text><text x="780" y="490">200 bp</text></g><text x="500" y="535" text-anchor="middle" font-family="Arial" font-size="13" fill="#68788e">NAV-floor trigger is a model event, not legal default or a credit rating.</text></svg>